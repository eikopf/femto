[package]
name = "femto"
default-run = "femto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
native-mbedtls-tests = []
desktop = ["dep:minifb"]

[[bin]]
name = "femto-simulator"
path = "src/simulator.rs"
required-features = ["desktop"]

[dependencies]
serde.workspace = true
zeroize = { version = "=1.9.1", features = ["serde"] }
url = "=2.5.8"
femto-catalog = { path = "../femto-catalog", features = ["tailnet"] }
femto-reader = { path = "../femto-reader" }
femto-kosync = { path = "../femto-kosync", features = ["reader"] }
femto-microlink = { path = "../femto-microlink" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
minifb = { version = "=0.28.0", optional = true }

tempfile.workspace = true


[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(all(unix, not(target_os = "espidf")))'.dependencies]
sha2.workspace = true
httparse = "=1.10.1"
fs2 = "=0.4.3"
signal-hook = { version = "=0.4.4", default-features = false }

[target.'cfg(all(unix, not(target_os = "espidf")))'.dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }

[dev-dependencies]
proptest = "1"
