[package]
name = "femto-reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
esp-idf-sha256 = ["dep:esp-idf-sys"]

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "=0.38.1", optional = true }

[dependencies]
femto-remote = { path = "../femto-remote" }
quireink-stardict.workspace = true
quireink-platform.workspace = true
epub-stream.workspace = true
quick-xml = { version = "=0.39.4", default-features = false }
rustybuzz.workspace = true
yoke.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
unicode-script.workspace = true
unicode-normalization.workspace = true
hypher.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
png.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
proptest = "1"
tempfile.workspace = true

